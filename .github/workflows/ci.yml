name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Node ${{ matrix.node-version }} checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22.13.0
          - 24
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate contracts
        run: npm run check:contracts

      - name: Check documentation links
        run: npm run check:docs

      - name: Run unit and integration tests
        run: npm test

  e2e:
    name: Node 22.13 E2E and soak
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Mock PLC E2E and commissioning doctor
        run: npm run e2e

      - name: Run Gateway E2E
        run: npm run e2e:gateway

      - name: Run PLC diagnostics E2E
        run: npm run e2e:diagnostics

      - name: Run OPC UA security E2E
        run: npm run e2e:security

      - name: Run clock synchronization E2E
        run: npm run e2e:clock

      - name: Run soak smoke
        env:
          SOAK_DURATION_MS: 20000
          SOAK_API_INTERVAL_MS: 500
          SOAK_QUALITY_INTERVAL_MS: 2000
          SOAK_WORK_CONTEXT_INTERVAL_MS: 5000
          SOAK_FAULT_INTERVAL_MS: 3000
          SOAK_RECONNECT_INTERVAL_MS: 7000
          SOAK_RECONNECT_TIMEOUT_MS: 30000
          SOAK_REPORT_PATH: ${{ github.workspace }}/data/soak-report.json
        run: npm run soak

      - name: Upload soak report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-report-node22-13
          path: data/soak-report.json
          if-no-files-found: warn

  release:
    name: Release archive
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm run security:audit

      - name: Build and verify release
        run: |
          npm run release:package -- --output dist/release
          ARCHIVE=$(find dist/release -maxdepth 1 -name '*.tar.gz' -print -quit)
          npm run release:verify -- --archive "$ARCHIVE"
          SBOM="${ARCHIVE%.tar.gz}.sbom.cdx.json"
          npm run release:sbom -- --archive "$ARCHIVE" --output "$SBOM"
          AUDIT="${ARCHIVE%.tar.gz}.audit.json"
          VEX="${ARCHIVE%.tar.gz}.vex.cdx.json"
          EVIDENCE="${ARCHIVE%.tar.gz}.evidence.json"
          echo "RELEASE_ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"
          echo "RELEASE_SBOM=$SBOM" >> "$GITHUB_ENV"
          echo "RELEASE_AUDIT=$AUDIT" >> "$GITHUB_ENV"
          echo "RELEASE_VEX=$VEX" >> "$GITHUB_ENV"
          echo "RELEASE_EVIDENCE=$EVIDENCE" >> "$GITHUB_ENV"

      - name: Sign, verify, and audit release smoke
        run: |
          set -euo pipefail
          KEY_DIR=$(mktemp -d)
          trap 'rm -rf "$KEY_DIR"' EXIT
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 \
            -out "$KEY_DIR/release-private.pem"
          openssl pkey -in "$KEY_DIR/release-private.pem" \
            -pubout -out "$KEY_DIR/release-public.pem"
          npm run release:sign -- \
            --archive "$RELEASE_ARCHIVE" \
            --private-key "$KEY_DIR/release-private.pem"
          npm run release:verify-signature -- \
            --archive "$RELEASE_ARCHIVE" \
            --public-key "$KEY_DIR/release-public.pem"
          npm run release:audit -- \
            --archive "$RELEASE_ARCHIVE" \
            --public-key "$KEY_DIR/release-public.pem" \
            --require-signature \
            --dispositions security/advisory-dispositions.json \
            --output "$RELEASE_AUDIT" \
            --vex-output "$RELEASE_VEX"
          npm run release:evidence -- \
            --archive "$RELEASE_ARCHIVE" \
            --sbom "$RELEASE_SBOM" \
            --audit "$RELEASE_AUDIT" \
            --vex "$RELEASE_VEX" \
            --public-key "$KEY_DIR/release-public.pem" \
            --require-signature \
            --output "$RELEASE_EVIDENCE"

      - name: Upload release audit and VEX
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rpi4-gateway-release-audit
          path: |
            ${{ env.RELEASE_AUDIT }}
            ${{ env.RELEASE_VEX }}
            ${{ env.RELEASE_EVIDENCE }}
          if-no-files-found: warn

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: rpi4-gateway-release
          path: |
            ${{ env.RELEASE_ARCHIVE }}
            ${{ env.RELEASE_ARCHIVE }}.sha256
            ${{ env.RELEASE_SBOM }}
          if-no-files-found: error
