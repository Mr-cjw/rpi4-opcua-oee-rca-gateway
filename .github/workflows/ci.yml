name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Node ${{ matrix.node-version }} checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 20
          - 22
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate contracts
        run: npm run check:contracts

      - name: Check documentation links
        run: npm run check:docs

      - name: Run unit and integration tests
        run: npm test

  e2e:
    name: Node 20 E2E and soak
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Mock PLC E2E and commissioning doctor
        run: npm run e2e

      - name: Run Gateway E2E
        run: npm run e2e:gateway

      - name: Run PLC diagnostics E2E
        run: npm run e2e:diagnostics

      - name: Run soak smoke
        env:
          SOAK_DURATION_MS: 20000
          SOAK_API_INTERVAL_MS: 500
          SOAK_QUALITY_INTERVAL_MS: 2000
          SOAK_WORK_CONTEXT_INTERVAL_MS: 5000
          SOAK_FAULT_INTERVAL_MS: 3000
          SOAK_RECONNECT_INTERVAL_MS: 7000
          SOAK_RECONNECT_TIMEOUT_MS: 30000
          SOAK_REPORT_PATH: ${{ github.workspace }}/data/soak-report.json
        run: npm run soak

      - name: Upload soak report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-report-node20
          path: data/soak-report.json
          if-no-files-found: warn
