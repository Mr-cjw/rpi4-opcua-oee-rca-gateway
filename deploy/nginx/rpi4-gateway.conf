# TLS-terminating reverse proxy template for the Raspberry Pi Gateway.
#
# Install this file under /etc/nginx/conf.d/ after replacing the example
# hostname, certificate paths, and monitoring source network. This file is
# included in nginx's http context. See deploy/nginx/README.md for installation,
# verification, certificate rotation, and edge-authentication guidance.
#
# Security boundary:
# - the Gateway continues to listen only on 127.0.0.1:8080;
# - this proxy exposes 443 only and redirects HTTP to HTTPS;
# - GATEWAY_API_TOKEN remains required for /metrics and /v1/*;
# - /healthz defaults to loopback and must not be opened to an untrusted network;
# - certificates, private keys, client CAs, and password files are never stored
#   in this repository.

log_format rpi4_gateway escape=json
    '{"time":"$time_iso8601",'
    '"remote_addr":"$remote_addr",'
    '"host":"$host",'
    '"method":"$request_method",'
    '"uri":"$request_uri",'
    '"status":$status,'
    '"bytes_sent":$body_bytes_sent,'
    '"request_time":$request_time,'
    '"upstream_status":"$upstream_status",'
    '"upstream_time":"$upstream_response_time",'
    '"user_agent":"$http_user_agent"}';

limit_req_zone $binary_remote_addr zone=rpi4_gateway_api:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=rpi4_gateway_per_ip:10m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name gateway.example.invalid;

    server_tokens off;
    access_log /var/log/nginx/rpi4-gateway-access.log rpi4_gateway;
    error_log /var/log/nginx/rpi4-gateway-error.log warn;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gateway.example.invalid;

    ssl_certificate /etc/rpi4-gateway/tls/fullchain.pem;
    ssl_certificate_key /etc/rpi4-gateway/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:rpi4_gateway_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_ecdh_curve X25519:prime256v1:secp384r1;

    # Optional site-approved client-certificate authentication. Enable both
    # directives and the location guard comments below, then restrict the client
    # CA file to root ownership.
    # ssl_client_certificate /etc/rpi4-gateway/tls/edge-client-ca.pem;
    # ssl_verify_client optional;

    # Only enable HSTS after the site confirms permanent HTTPS for this name.
    # add_header Strict-Transport-Security "max-age=31536000" always;

    server_tokens off;
    limit_conn rpi4_gateway_per_ip 20;
    limit_conn_status 429;
    limit_req_status 429;

    client_max_body_size 1m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    send_timeout 30s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;

    access_log /var/log/nginx/rpi4-gateway-access.log rpi4_gateway;
    error_log /var/log/nginx/rpi4-gateway-error.log warn;

    # If an approved load balancer fronts this proxy, trust only its exact source
    # addresses before enabling real-IP handling. Do not trust arbitrary peers.
    # set_real_ip_from 10.20.30.40;
    # real_ip_header X-Forwarded-For;
    # real_ip_recursive on;

    location = /healthz {
        limit_except GET {
            deny all;
        }
        limit_req zone=rpi4_gateway_api burst=5 nodelay;

        allow 127.0.0.1;
        allow ::1;
        # Add only the approved monitoring network, for example:
        # allow 10.20.30.0/24;
        deny all;

        # Uncomment this guard only if health checks also use edge mTLS.
        # if ($ssl_client_verify != SUCCESS) { return 403; }

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_hide_header Server;
        proxy_redirect off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_pass http://127.0.0.1:8080;
    }

    location = /metrics {
        limit_except GET {
            deny all;
        }
        limit_req zone=rpi4_gateway_api burst=20 nodelay;

        # Uncomment this guard when edge mTLS is enabled.
        # if ($ssl_client_verify != SUCCESS) { return 403; }

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # For approved Basic Auth at the edge, carry the application token in
        # X-Gateway-Authorization and set this line to
        # $http_x_gateway_authorization instead of reusing Authorization.
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_hide_header Server;
        proxy_redirect off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_pass http://127.0.0.1:8080;
    }

    location /v1/ {
        limit_except GET POST {
            deny all;
        }
        limit_req zone=rpi4_gateway_api burst=20 nodelay;

        # Uncomment this guard when edge mTLS is enabled.
        # if ($ssl_client_verify != SUCCESS) { return 403; }

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # For approved Basic Auth at the edge, carry the application token in
        # X-Gateway-Authorization and set this line to
        # $http_x_gateway_authorization instead of reusing Authorization.
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_hide_header Server;
        proxy_redirect off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_pass http://127.0.0.1:8080;
    }

    location / {
        return 404;
    }
}
